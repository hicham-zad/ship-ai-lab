<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Four cards listing possible reactions when alcohol is mixed with depression medicines"><defs><linearGradient id="ad3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCF6EF"/><stop offset="1" stop-color="#F9E8E3"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#ad3)"/>
