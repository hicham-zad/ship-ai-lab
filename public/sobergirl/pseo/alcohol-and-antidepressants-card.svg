<circle cx="96" cy="641.25" r="229.50000000000003" fill="#EBDCE6" opacity="0.7"/><text x="70" y="90" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#5A2A4C">Alcohol with depression medicines</text><text x="70" y="128" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="22" fill="#6E5566">Possible reactions listed by NIAAA (Harmful Interactions)</text><rect x="70" y="170" width="510" height="180" rx="28" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="70" y="170" width="16" height="180" rx="8" fill="#E9C98F"/><text x="114" y="248" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Drowsiness, dizziness</text><text x="114" y="290" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21" fill="#6E5566">all the medicines listed</text><rect x="610" y="170" width="510" height="180" rx="28" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="610" y="170" width="16" height="180" rx="8" fill="#D2716F"/><text x="654" y="248" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Overdose risk</text><text x="654" y="290" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21" fill="#6E5566">increased, all listed</text><rect x="70" y="380" width="510" height="180" rx="28" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="70" y="380" width="16" height="180" rx="8" fill="#7C4B6D"/><text x="114" y="458" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Worse depression</text><text x="114" y="500" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21" fill="#6E5566">or hopelessness, all listed</text><rect x="610" y="380" width="510" height="180" rx="28" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="610" y="380" width="16" height="180" rx="8" fill="#E8928E"/><text x="654" y="458" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">MAOIs</text><text x="654" y="500" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21" fill="#6E5566">heart effects; tyramine in beer and red</text><text x="654" y="528" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="21" fill="#6E5566">wine</text><text x="70" y="630" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#5A2A4C">Not a full list. Ask your prescriber about your own medicine.</text></svg>