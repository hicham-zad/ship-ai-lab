<circle cx="96" cy="641.25" r="229.50000000000003" fill="#EBDCE6" opacity="0.7"/><text x="70" y="90" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" fill="#5A2A4C">What the words mean on a US beer label</text><text x="70" y="128" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="21" fill="#6E5566">TTB rules for malt beverages. Wine under 7% follows FDA food labeling rules.</text><rect x="70" y="190" width="330" height="360" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="235" cy="270" r="50" fill="#E9C98F"/><path d="M213 270 l16 18 l30 -34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#5A2A4C">Non-alcoholic</text><text x="235" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#3A2235">Under 0.5% alcohol by volume</text><text x="235" y="466" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">with the statement beside it</text><rect x="430" y="190" width="330" height="360" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="595" cy="270" r="50" fill="#8FAE8F"/><path d="M573 270 l16 18 l30 -34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="595" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#5A2A4C">Alcohol free</text><text x="595" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#3A2235">Contains no alcohol</text><text x="595" y="466" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">the only wording that promises none</text><rect x="790" y="190" width="330" height="360" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="955" cy="270" r="50" fill="#E8928E"/><path d="M933 270 l16 18 l30 -34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="955" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#5A2A4C">Low alcohol</text><text x="955" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#3A2235">Under 2.5% alcohol by volume</text><text x="955" y="466" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">also “reduced alcohol”</text><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(0 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(45 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(90 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(135 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(180 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(225 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(270 80 632)"/><ellipse cx="80" cy="620.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(315 80 632)"/><circle cx="80" cy="632" r="5.040000000000001" fill="#5A2A4C"/><text x="110" y="640" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#5A2A4C">sober girl</text></svg>