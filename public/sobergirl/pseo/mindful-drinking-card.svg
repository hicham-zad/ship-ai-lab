<circle cx="96" cy="641.25" r="229.50000000000003" fill="#EBDCE6" opacity="0.7"/><text x="70" y="90" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" fill="#5A2A4C">Five questions before you pour</text><rect x="70" y="150" width="1060" height="74" rx="37" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="116" cy="187" r="26" fill="#E8928E"/><text x="116" y="197" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#fff">1</text><text x="170" y="197" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29" fill="#3A2235">Do I want this, or is it 6pm?</text><rect x="70" y="242" width="1060" height="74" rx="37" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="116" cy="279" r="26" fill="#E9C98F"/><text x="116" y="289" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#fff">2</text><text x="170" y="289" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29" fill="#3A2235">What am I feeling right now?</text><rect x="70" y="334" width="1060" height="74" rx="37" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="116" cy="371" r="26" fill="#8FAE8F"/><text x="116" y="381" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#fff">3</text><text x="170" y="381" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29" fill="#3A2235">How many, and when will I stop?</text><rect x="70" y="426" width="1060" height="74" rx="37" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><circle cx="116" cy="463" r="26" fill="#7C4B6D"/><text x="116" y="473" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#fff">4</text><text x="170" y="473" text-anchor="start" font-