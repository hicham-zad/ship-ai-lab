<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Alcohol belly split into calories, belly fat and swelling"><defs><linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCF6EF"/><stop offset="1" stop-color="#F9E8E3"/></linearGradient></defs>
<rect width="1200" height="560" fill="url(#bl)"/>
<circle cx="1020" cy="67.2" r="235.2" fill="#E8928E" opacity="0.13"/>
<circle cx="96" cy="532" r="190.4" fill="#EBDCE6" opacity="0.7"/><text x="70" y="85" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#5A2A4C">Alcohol belly: three different questions</text><rect x="70" y="130" width="330" height="330" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="70" y="130" width="330" height="14" rx="7" fill="#E9C98F"/><text x="98" y="205" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Calories</text><text x="98" y="270" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#3A2235">About 98 kcal per</text><text x="98" y="298" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#3A2235">standard drink</text><text x="98" y="345" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">from the alcohol alone (7 kcal</text><text x="98" y="371" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">per gram)</text><rect x="430" y="130" width="330" height="330" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="430" y="130" width="330" height="14" rx="7" fill="#E8928E"/><text x="458" y="205" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Belly fat</text><text x="458" y="270" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#3A2235">Evidence is mixed</text><text x="458" y="345" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">Inadequate at under 500 mL</text><text x="458" y="371" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">beer a day; inconsistent in</text><text x="458" y="397" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">women</text><rect x="790" y="130" width="330" height="330" rx="30" fill="#fff" stroke="#EFDDD6" stroke-width="3"/><rect x="790" y="130" width="330" height="14" rx="7" fill="#D2716F"/><text x="818" y="205" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#5A2A4C">Swelling</text><text x="818" y="270" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#3A2235">Can be gastritis or</text><text x="818" y="298" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#3A2235">ascites</text><text x="818" y="345" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">Persistent swelling, pain or</text><text x="818" y="371" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6E5566">jaundice: see a provider</text><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(0 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(45 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(90 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(135 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(180 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(225 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(270 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(315 80 512)"/><circle cx="80" cy="512" r="5.040000000000001" fill="#5A2A4C"/><text x="110" y="520" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#5A2A4C">sober girl</text></svg>