<circle cx="96" cy="532" r="190.4" fill="#EBDCE6" opacity="0.7"/><text x="70" y="85" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#5A2A4C">Does more resveratrol mean living longer?</text><text x="70" y="122" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Deaths over 9 years by quartile of urinary resveratrol. 783 adults aged 65 and over.</text><rect x="110" y="182" width="170" height="258" rx="18" fill="#8FAE8F"/><text x="195" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#5A2A4C">34.4%</text><text x="195" y="480" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="#6E5566">Lowest</text><rect x="360" y="203" width="170" height="237" rx="18" fill="#8FAE8F"/><text x="445" y="193" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#5A2A4C">31.6%</text><text x="445" y="480" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="#6E5566">Second</text><rect x="610" y="188.75" width="170" height="251.25" rx="18" fill="#8FAE8F"/><text x="695" y="178.75" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#5A2A4C">33.5%</text><text x="695" y="480" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="#6E5566">Third</text><rect x="860" y="159.5" width="170" height="280.5" rx="18" fill="#7C4B6D"/><text x="945" y="149.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#5A2A4C">37.4%</text><text x="945" y="480" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="#6E5566">Highest</text><t