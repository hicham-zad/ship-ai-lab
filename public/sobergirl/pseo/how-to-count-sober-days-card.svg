<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Timeline from a last drink to day three"><defs><linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCF6EF"/><stop offset="1" stop-color="#F9E8E3"/></linearGradient></defs>
<rect width="1200" height="500" fill="url(#tb)"/>
<circle cx="1020" cy="60" r="210" fill="#E8928E" opacity="0.13"/>
<circle cx="96" cy="475" r="170" fill="#EBDCE6" opacity="0.7"/><text x="70" y="80" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="38" fill="#5A2A4C">From sober date to day count</text><line x1="120" y1="270" x2="1080" y2="270" stroke="#EBDCE6" stroke-width="14" stroke-linecap="round"/><circle cx="130" cy="270" r="30" fill="#D2716F" stroke="#fff" stroke-width="6"/><text x="130" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#3A2235">Fri 9pm</text><text x="130" y="345" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Last drink</text><circle cx="365" cy="270" r="30" fill="#7C4B6D" stroke="#fff" stroke-width="6"/><text x="365" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#3A2235">Midnight</text><text x="365" y="345" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Sober date starts</text><circle cx="600" cy="270" r="30" fill="#8FAE8F" stroke="#fff" stroke-width="6"/><text x="600" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#3A2235">Sat midnight</text><text x="600" y="345" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Day 1 complete</text><circle cx="835" cy="270" r="30" fill="#8FAE8F" stroke="#fff" stroke-width="6"/><text x="835" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#3A2235">Sun midnight</text><text x="835" y="345" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Day 2</text><circle cx="1070" cy="270" r="30" fill="#5E8262" stroke="#fff" stroke-width="6"/><text x="1070" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#3A2235">Mon midnight</text><text x="1070" y="345" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="20" fill="#6E5566">Day 3</text><text x="70" y="440" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="21" fill="#6E5566">Common convention: your sober date is the first full day without a drink.</text></svg>