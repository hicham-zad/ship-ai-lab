<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Timeline of what is documented after you stop drinking alcohol"><defs><linearGradient id="tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCF6EF"/><stop offset="1" stop-color="#F9E8E3"/></linearGradient></defs>
<rect width="1200" height="560" fill="url(#tl)"/>
<circle cx="1020" cy="67.2" r="235.2" fill="#E8928E" opacity="0.13"/>
<circle cx="96" cy="532" r="190.4" fill="#EBDCE6" opacity="0.7"/><text x="70" y="85" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#5A2A4C">What is documented after you stop drinking</text><text x="70" y="122" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="21" fill="#6E5566">Each stage has its own page. Sources are on the guide.</text><line x1="110" y1="300" x2="1090" y2="300" stroke="#EBDCE6" stroke-width="14" stroke-linecap="round"/><circle cx="120" cy="300" r="34" fill="#D2716F" stroke="#fff" stroke-width="6"/><text x="120" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">8 h</text><text x="120" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Withdrawal can start</text><circle cx="257" cy="300" r="34" fill="#E8928E" stroke="#fff" stroke-width="6"/><text x="257" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">3 d</text><text x="257" y="385" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Symptoms peak</text><circle cx="394" cy="300" r="34" fill="#E9C98F" stroke="#fff" stroke-width="6"/><text x="394" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">1 w</text><text x="394" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Sleep shifts</text><circle cx="531" cy="300" r="34" fill="#8FAE8F" stroke="#fff" stroke-width="6"/><text x="531" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">2 w</text><text x="531" y="385" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Mood may settle</text><circle cx="668" cy="300" r="34" fill="#5E8262" stroke="#fff" stroke-width="6"/><text x="668" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">30 d</text><text x="668" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">One month studied</text><circle cx="805" cy="300" r="34" fill="#7C4B6D" stroke="#fff" stroke-width="6"/><text x="805" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">90 d</text><text x="805" y="385" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Initial stage ends</text><circle cx="942" cy="300" r="34" fill="#5A2A4C" stroke="#fff" stroke-width="6"/><text x="942" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">6 m</text><text x="942" y="225" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Early stage</text><circle cx="1079" cy="300" r="34" fill="#C79A4A" stroke="#fff" stroke-width="6"/><text x="1079" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="21" fill="#fff">1 y</text><text x="1079" y="385" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" fill="#3A2235">Sustained stage</text><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(0 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#E8928E" opacity="0.92" transform="rotate(45 80 512)"/><ellipse cx="80" cy="500.84" rx="5.3999999999999995" ry="9.9" fill="#